name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: zig fmt --check build.zig src

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: zig build
      - run: zig build test --summary all

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: zig build docs

  lint:
    name: zlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install zlint (pinned + checksum-verified)
        run: |
          curl -fsSL -o zlint \
            https://github.com/DonIsaac/zlint/releases/download/v0.8.1/zlint-linux-x86_64
          echo "e50df2d3b23843c9833fe532cf6da9a442f2c06890b3b6bf4afe6809be97ab22  zlint" \
            | sha256sum -c -
          chmod +x zlint
      # Lint our own source only — not the vendored third-party build scripts
      # under testdata/integration (zlint walks the whole tree otherwise and
      # flags their unresolved imports).
      - name: Run zlint
        run: ./zlint build.zig src/*.zig
      # shellcheck is preinstalled on the runner; lint the shipped task scripts.
      - name: Run shellcheck
        run: shellcheck tasks/*.sh

  sbom:
    name: SBOM validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: zig build
      - name: Generate SBOMs from a multi-dependency fixture
        # The fixture exercises components, dependency edges, and findings-as-
        # properties (a zero-dep SBOM would only cover the document skeleton).
        # `--fail-on=never` so the deliberate findings don't make the step exit
        # non-zero before the SBOM is written.
        run: |
          args="testdata/sbom/proj/build.zig.zon --cache testdata/sbom/cache --scan --fail-on=never"
          ./zig-out/bin/zonar audit $args --sbom=cyclonedx > bom.cdx.json
          ./zig-out/bin/zonar audit $args --sbom=spdx > bom.spdx.json
      - name: Validate CycloneDX (pinned + checksum-verified)
        run: |
          curl -fsSL -o cyclonedx \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.32.0/cyclonedx-linux-x64
          echo "454879e6a4a405c8a13bff49b8982adcb0596f3019b26b0811c66e4d7f0783e1  cyclonedx" \
            | sha256sum -c -
          chmod +x cyclonedx
          ./cyclonedx validate --input-file bom.cdx.json --input-format json --fail-on-errors
      - name: Validate SPDX (pinned)
        run: pipx run --spec 'spdx-tools==0.8.5' pyspdxtools -i bom.spdx.json

  integration:
    name: Integration (real repos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: zig build
      # Offline: audits the pinned real-world manifests under testdata/integration
      # and diffs zonar's JSON against the committed goldens. No external tools.
      - run: ./tasks/integration-test.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: zig fmt --check build.zig src

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: zig build
      - run: zig build test --summary all

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: zig build docs

  lint:
    name: zlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install zlint (pinned + checksum-verified)
        run: |
          curl -fsSL -o zlint \
            https://github.com/DonIsaac/zlint/releases/download/v0.8.1/zlint-linux-x86_64
          echo "e50df2d3b23843c9833fe532cf6da9a442f2c06890b3b6bf4afe6809be97ab22  zlint" \
            | sha256sum -c -
          chmod +x zlint
      - name: Run zlint
        run: ./zlint

  sbom:
    name: SBOM validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - run: zig build
      - name: Generate zonar's own SBOMs
        run: |
          ./zig-out/bin/zonar audit --sbom=cyclonedx > bom.cdx.json
          ./zig-out/bin/zonar audit --sbom=spdx > bom.spdx.json
      - name: Validate CycloneDX (pinned + checksum-verified)
        run: |
          curl -fsSL -o cyclonedx \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.32.0/cyclonedx-linux-x64
          echo "454879e6a4a405c8a13bff49b8982adcb0596f3019b26b0811c66e4d7f0783e1  cyclonedx" \
            | sha256sum -c -
          chmod +x cyclonedx
          ./cyclonedx validate --input-file bom.cdx.json --input-format json --fail-on-errors
      - name: Validate SPDX
        run: pipx run --spec spdx-tools pyspdxtools -i bom.spdx.json

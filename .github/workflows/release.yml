name: Release

on:
  push:
    tags: ['v*']

# The release job needs to create a release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: Build, sign, and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Build, package, and sign every target
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          # Zig cross-compiles every target from this one Linux runner.
          targets=(
            x86_64-linux-musl
            aarch64-linux-musl
            x86_64-macos
            aarch64-macos
            x86_64-windows
            aarch64-windows
          )
          mkdir -p dist
          printf '%s' "$MINISIGN_SECRET_KEY" > minisign.key
          for t in "${targets[@]}"; do
            echo "::group::$t"
            rm -rf zig-out
            zig build -Dtarget="$t" -Doptimize=ReleaseSafe
            name="zonar-${t}"
            if [[ "$t" == *windows* ]]; then
              (cd zig-out/bin && zip -q "${GITHUB_WORKSPACE}/dist/${name}.zip" zonar.exe)
              archive="dist/${name}.zip"
            else
              tar -C zig-out/bin -czf "dist/${name}.tar.gz" zonar
              archive="dist/${name}.tar.gz"
            fi
            # Passwordless key (generated with `minisign -G -W`) signs without a prompt.
            minisign -S -s minisign.key -m "$archive"
            echo "::endgroup::"
          done
          rm -f minisign.key
          # Publish the public key alongside the artifacts for convenience (the
          # trust root is the copy committed in the repo, not this one).
          cp minisign.pub dist/
          sha256sum dist/* > dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "zonar ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
